<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>小龙GESP精进 · 排行榜</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#f5f7fc 0%,#eef1f7 100%);color:#17212b}
body{display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;min-height:100vh}
.container{max-width:680px;width:100%}
h1{text-align:center;font-size:32px;font-weight:750;margin-bottom:8px}
.subtitle{text-align:center;font-size:15px;color:#68768a;margin-bottom:28px}
.login-bar{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.login-bar input{padding:10px 18px;border:1px solid #d4ddee;border-radius:30px;font-size:15px;background:#fcfdfe;width:160px}
.login-bar button{padding:10px 22px;border:none;border-radius:30px;font-size:15px;font-weight:600;cursor:pointer;background:#2563eb;color:#fff}
.login-bar button:hover{background:#1d4ed8}
.login-bar .hint{font-size:13px;color:#8896aa}
.login-bar .admin-badge{background:#fef3c7;color:#92400e;padding:4px 14px;border-radius:20px;font-size:14px;font-weight:600}
.rank-card{background:white;border-radius:24px;padding:20px 24px;margin:10px 0;display:flex;align-items:center;gap:14px;box-shadow:0 4px 14px rgba(0,0,0,.04);border:1px solid #e9edf4;transition:.12s}
.rank-card:hover{box-shadow:0 8px 22px rgba(37,99,235,.07);border-color:#b8cbe0}
.rank-num{font-size:22px;font-weight:750;min-width:36px;text-align:center}
.rank-num.gold{color:#f59e0b}.rank-num.silver{color:#94a3b8}.rank-num.bronze{color:#b45309}
.rank-name{flex:1;font-size:18px;font-weight:600}
.rank-score{font-size:20px;font-weight:700;color:#2563eb;min-width:60px;text-align:right}
.score-btns{display:flex;gap:6px}
.score-btns button{padding:4px 12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.1s}
.score-btns .add-btn{background:#dcfce7;color:#16a34a}.score-btns .add-btn:hover{background:#16a34a;color:#fff}
.score-btns .sub-btn{background:#fee2e2;color:#dc2626}.score-btns .sub-btn:hover{background:#dc2626;color:#fff}
.empty-tip{text-align:center;color:#8896aa;padding:40px 0;font-size:16px}
.back-link{text-align:center;margin-top:24px}
.back-link a{color:#2563eb;font-size:14px;text-decoration:none}
.back-link a:hover{text-decoration:underline}
@media(max-width:600px){.container{padding:0}.rank-card{padding:14px 16px;flex-wrap:wrap}.rank-name{font-size:16px}.rank-score{font-size:18px}}
</style>
</head>
<body>
<div class="container">
  <h1>🏆 排行榜</h1>
  <div class="subtitle">注册用户自动上榜，初始 0 分</div>

  <div class="login-bar" id="loginBar">
    <input type="text" id="loginUser" placeholder="用户名">
    <input type="password" id="loginPass" placeholder="密码" style="width:130px">
    <button onclick="doLogin()">管理员登录</button>
    <span class="hint">CD小狼2015 可管理分数</span>
  </div>
  <div class="login-bar" id="adminBar" style="display:none">
    <span class="admin-badge">✓ 管理员模式</span>
    <button onclick="doLogout()" style="background:#ef4444;padding:8px 18px;font-size:14px">退出</button>
  </div>

  <div id="rankList"></div>

  <div class="back-link"><a href="https://cdxiaolang.github.io/%E5%B0%8F%E9%BE%99GESP%E7%B2%BE%E8%BF%9B%EF%BC%88%E4%B8%BB%E7%AB%99%EF%BC%89">← 返回主站</a></div>
</div>

<script>
const KEY_USERS = 'teamUsersV5';
const ADMIN = 'CD小狼2015';

let users = JSON.parse(localStorage.getItem(KEY_USERS) || '[]');
let isAdmin = false;

function saveUsers() { localStorage.setItem(KEY_USERS, JSON.stringify(users)); }

function render() {
  const list = document.getElementById('rankList');
  if (!users.length) {
    list.innerHTML = '<div class="empty-tip">暂无用户，去主站注册吧</div>';
    return;
  }
  const sorted = [...users].sort((a, b) => (b.score || 0) - (a.score || 0));
  list.innerHTML = sorted.map((u, i) => {
    const rank = i + 1;
    let numClass = '';
    if (rank === 1) numClass = 'gold';
    else if (rank === 2) numClass = 'silver';
    else if (rank === 3) numClass = 'bronze';
    return `<div class="rank-card">
      <div class="rank-num ${numClass}">#${rank}</div>
      <div class="rank-name">${u.name}${u.name === ADMIN ? ' <span style="font-size:13px;color:#f59e0b">👑</span>' : ''}</div>
      <div class="rank-score">${u.score || 0} 分</div>
      ${isAdmin ? `<div class="score-btns"><button class="add-btn" onclick="addScore('${u.name}')">+1</button><button class="sub-btn" onclick="subScore('${u.name}')">-1</button></div>` : ''}
    </div>`;
  }).join('');
}

function addScore(name) {
  const u = users.find(x => x.name === name);
  if (u) { u.score = (u.score || 0) + 1; saveUsers(); render(); }
}
function subScore(name) {
  const u = users.find(x => x.name === name);
  if (u) { u.score = Math.max(0, (u.score || 0) - 1); saveUsers(); render(); }
}

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  if (!u || !p) return alert('填完整');
  const found = users.find(x => x.name === u && x.password === p);
  if (!found) return alert('账号或密码错误');
  if (u === ADMIN) {
    isAdmin = true;
    document.getElementById('loginBar').style.display = 'none';
    document.getElementById('adminBar').style.display = 'flex';
    render();
  } else {
    alert('只有管理员可以登录排行榜管理');
  }
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

function doLogout() {
  isAdmin = false;
  document.getElementById('loginBar').style.display = 'flex';
  document.getElementById('adminBar').style.display = 'none';
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !isAdmin) doLogin();
});

render();
</script>
</body>
</html>
