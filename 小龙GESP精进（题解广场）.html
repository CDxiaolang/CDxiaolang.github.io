<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>小龙GESP精进 · 题解广场</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:"Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#f5f7fc,#eef1f7);color:#17212b}
body{padding:32px 48px 64px}
body.modal-open{overflow:hidden}
.top-bar{display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.back-btn{padding:10px 24px;border:none;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;background:#eef2f9;color:#475569;text-decoration:none;display:inline-block}
.back-btn:hover{background:#e2e8f3}
.page-title{font-size:32px;font-weight:750}
.user-area{margin-left:auto;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:#c8d0db;color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.avatar.logged{background:linear-gradient(135deg,#2563eb,#4f8df7)}
.user-name{font-size:15px;color:#475569;font-weight:550}
.login-hint{font-size:14px;color:#8896aa;cursor:pointer;text-decoration:underline}
.pending-section{position:relative;margin-bottom:32px;background:#fff;border-radius:24px;padding:28px 32px;border:2px solid #bae6fd}
.pending-tag{position:absolute;top:-14px;right:24px;background:#0284c7;color:#fff;padding:4px 18px;border-radius:12px;font-size:16px;font-weight:700}
.section-title{font-size:24px;font-weight:720;margin-bottom:16px;color:#17212b}
.post-section{background:#fff;border-radius:24px;padding:28px 32px;margin-bottom:32px;border:1px solid #e9edf4;box-shadow:0 4px 14px rgba(0,0,0,.03)}
.post-section h3{font-size:22px;margin-bottom:14px}
.post-section select,.post-section textarea{width:100%;padding:16px 20px;border:1px solid #d4ddee;border-radius:20px;font-size:17px;font-family:inherit;background:#fcfdfe;outline:none;resize:vertical}
.post-section textarea{min-height:180px;margin-top:12px}
.limit-hint{font-size:15px;color:#64748b;margin:10px 0}
.post-actions{margin-top:14px;display:flex;gap:14px;justify-content::space-between;align-items:center;flex-wrap:wrap}
.post-actions .hint{color:#66768a;font-size:15px}
.post-actions button{padding:12px 36px;border:none;border-radius:30px;font-size:17px;font-weight:600;cursor:pointer;background:#2563eb;color:#fff}
.post-actions button:hover{background:#1d4ed8}
.solutions-section{background:#fff;border-radius:24px;padding:28px 32px;border:1px solid #e9edf4;box-shadow:0 4px 14px rgba(0,0,0,.03)}
.solution-card{background:#fff;border:3px solid #b9b9b9;border-radius:8px;padding:20px 24px;margin:18px 0;box-shadow:0 6px 18px rgba(0,0,0,.04);cursor:pointer;transition:.12s}
.solution-card:hover{border-color:#2563eb;box-shadow:0 8px 24px rgba(37,99,235,.1)}
.solution-card .sol-head{font-size:20px;color:#333;font-weight:600;line-height:1.5}
.solution-card .sol-meta{color:#666;font-size:15px;margin-top:6px}
.solution-card .sol-body{margin-top:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-all;color:#374151;font-size:15px;line-height:1.65}
.solution-card .sol-actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.solution-card .sol-actions button{padding:8px 22px;border:none;border-radius:999px;font-size:15px;cursor:pointer;font-weight:600}
.modal-overlay{display:none;position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;background:rgba(15,23,42,.6)!important;z-index:99999!important;justify-content:center;align-items:center;padding:24px}
.modal-overlay.show{display:flex!important}
.modal-box{background:#fff;max-width:920px;width:94%;max-height:86vh;overflow-y:auto;border-radius:24px;padding:34px 38px 28px;box-shadow:0 50px 82px rgba(0,0,0,.38);position:relative;z-index:100000}
.modal-close{position:absolute;top:12px;right:18px;background:transparent;border:none;font-size:28px;cursor:pointer;color:#666;line-height:1}
.modal-actions{margin-top:18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid #eef2f7;padding-top:16px}
.btn{display:inline-block;padding:10px 26px;border:none;border-radius:999px;font-size:15px;cursor:pointer;font-weight:600}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:#fef2f2;color:#dc2626}.btn-danger:hover{background:#fee2e2}
.btn-warn{background:#fef3c7;color:#b45309}.btn-warn:hover{background:#fde68a}
.btn-ghost{background:#f1f5f9;color:#334155}.btn-ghost:hover{background:#e2e8f0}
.detail-title{font-size:24px;font-weight:750;margin-bottom:8px;line-height:1.35}
.detail-meta{color:#666;font-size:14px;margin-bottom:16px}
.detail-content{font-size:17px;line-height:1.85;white-space:pre-wrap;word-break:break-word;color:#1e293b}
.empty-tip{color:#8896aa;padding:24px 0;text-align:center}
</style>
</head>
<body>

<div class="top-bar">
  <a class="back-btn" href="https://CDxiaolang.github.io/%E5%B0%8F%E9%BE%99GESP%E7%B2%BE%E8%BF%9B%EF%BC%88%E4%B8%BB%E7%AB%99%EF%BC%89.html">← 返回主页</a>
  <div class="page-title">✍️ 题解广场</div>
  <div class="user-area">
    <div class="avatar" id="avatarBtn">👤</div>
    <div class="user-name" id="userName"></div>
    <div class="login-hint" id="loginHint">登录/注册</div>
  </div>
</div>

<div class="pending-section" id="pendingSection" style="display:none">
  <div class="pending-tag">待审区</div>
  <div class="section-title">待审核题解</div>
  <div id="pendingList"></div>
</div>

<div class="post-section">
  <h3>💡 提交题解</h3>
  <select id="probSelect"></select>
  <div class="limit-hint" id="limitHint"></div>
  <textarea id="solContent" placeholder="写下你的题解，提交后进入待审区。"></textarea>
  <div class="post-actions">
    <span class="hint">题解会显示你的名字</span>
    <button onclick="submitSolution()">提交题解</button>
  </div>
</div>

<div class="solutions-section">
  <div class="section-title">已通过题解</div>
  <div id="solutionsList"></div>
</div>

<!-- 登录弹窗 -->
<div class="modal-overlay" id="authModal">
  <div class="modal-box" style="max-width:460px;padding:48px 44px;text-align:center">
    <h2>🔐 登录 / 注册</h2>
    <input type="text" id="miniUser" placeholder="用户名" maxlength="20" style="width:100%;padding:18px 24px;border:1px solid #d4ddee;border-radius:60px;font-size:18px;margin-bottom:16px;background:#fcfdfe;outline:none">
    <input type="password" id="miniPass" placeholder="密码（至少6位）" maxlength="30" style="width:100%;padding:18px 24px;border:1px solid #d4ddee;border-radius:60px;font-size:18px;margin-bottom:16px;background:#fcfdfe;outline:none">
    <div id="authMsg" style="font-size:16px;color:#dc2626;margin-top:4px;min-height:24px"></div>
    <div style="display:flex;gap:14px;margin-top:12px">
      <button style="flex:1;padding:16px;border:none;border-radius:68px;font-weight:628;font-size:18px;cursor:pointer;background:#2563eb;color:#fff" onclick="miniLogin()">登录</button>
      <button style="flex:1;padding:16px;border:none;border-radius:68px;font-weight:628;font-size:18px;cursor:pointer;background:#eef2f9" onclick="miniRegister()">注册</button>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeDetail()">✕</button>
    <div id="detailBody"></div>
    <div class="modal-actions" id="detailActions"></div>
  </div>
</div>

<script>
var KU='teamUsersV5', KS='teamSessionV5', AD='CD小狼2015';
var SS='teamSolutionsV6', PS='teamPendingSolutionsV1', SP='teamProblemsV5';

var users = JSON.parse(localStorage.getItem(KU)||'[]');
var cur = null;
var probs = JSON.parse(localStorage.getItem(SP)||'[]');
var sols = JSON.parse(localStorage.getItem(SS)||'[]');
var pending = JSON.parse(localStorage.getItem(PS)||'[]');
var currentOpenId = null, currentOpenIsPending = false;

function genId(){ return Date.now()+'_'+Math.random().toString(36).substr(2,9); }
function isAdm(){ return cur && cur.name === AD; }
function guardAction(){ if(cur) return true; openAuth(); return false; }
function esc(s){
  return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});
}

function findProblem(pid){
  if(!pid) return null;
  for(var i=0; i<probs.length; i++){
    var p = probs[i];
    if(p.id == pid || p.Id == pid || p.problemId == pid || String(p.id) === String(pid) || p.luoguId == pid || p.LuoguId == pid) return p;
  }
  return null;
}

function init(){
  try{
    var s = JSON.parse(localStorage.getItem(KS)||'null');
    if(s && s.name){ var l = users.find(function(u){return u.name===s.name}); if(l) cur={name:l.name,isAdmin:l.name===AD}; }
  }catch(e){}
  updateUserUI(); loadProbSelect(); renderPending(); renderSols();
}

function updateUserUI(){
  var av=document.getElementById('avatarBtn'), un=document.getElementById('userName'), lh=document.getElementById('loginHint');
  if(cur){ av.className='avatar logged'; av.textContent=cur.name.substr(0,1).toUpperCase(); un.textContent=cur.name+(isAdm()?' (管理员)':''); lh.style.display='none'; }
  else{ av.className='avatar'; av.textContent='👤'; un.textContent=''; lh.style.display='inline'; }
  document.getElementById('pendingSection').style.display = isAdm() ? 'block' : 'none';
}

document.getElementById('avatarBtn').onclick = function(){
  if(cur){ if(confirm('退出登录？')){ cur=null; localStorage.removeItem(KS); updateUserUI(); loadProbSelect(); renderPending(); } }
  else openAuth();
};
document.getElementById('loginHint').onclick = openAuth;
function openAuth(){ document.getElementById('authModal').style.display='flex'; document.getElementById('authModal').classList.add('show'); }
function closeAuth(){ document.getElementById('authModal').style.display='none'; document.getElementById('authModal').classList.remove('show'); document.getElementById('miniUser').value=''; document.getElementById('miniPass').value=''; }
function miniLogin(){
  var u=document.getElementById('miniUser').value.trim(), p=document.getElementById('miniPass').value.trim();
  if(!u||!p) return; if(u.length<2||p.length<6) return;
  var f=users.find(function(x){return x.name===u&&x.password===p});
  if(!f) return;
  cur={name:u,isAdmin:u===AD}; localStorage.setItem(KS,JSON.stringify(cur));
  closeAuth(); updateUserUI(); loadProbSelect(); renderPending();
}
function miniRegister(){
  var u=document.getElementById('miniUser').value.trim(), p=document.getElementById('miniPass').value.trim();
  if(!u||u.length<2||!p||p.length<6) return;
  if(users.find(function(x){return x.name===u})) return;
  users.push({name:u,password:p}); localStorage.setItem(KU,JSON.stringify(users));
  closeAuth(); miniLogin();
}

function loadProbSelect(){
  var sel=document.getElementById('probSelect');
  sel.innerHTML='<option value="">-- 选择题目 --</option>'+probs.map(function(p){
    var c=sols.filter(function(s){return s.problemId==p.id}).length;
    return '<option value="'+p.id+'">'+p.luoguId+' '+p.title+' [已通过 '+c+'/'+p.solutionLimit+']</option>';
  }).join('');
  updateLimitHint();
}
function updateLimitHint(){
  var sel=document.getElementById('probSelect'), h=document.getElementById('limitHint');
  if(!sel.value){ h.textContent=''; return; }
  var p=findProblem(sel.value);
  if(p){ var c=sols.filter(function(s){return s.problemId==p.id}).length; h.textContent='已通过题解：'+c+'/'+p.solutionLimit; h.style.color=c>=p.solutionLimit?'#dc2626':'#64748b'; }
}

function submitSolution(){
  if(!cur) return openAuth();
  var pid=document.getElementById('probSelect').value, c=document.getElementById('solContent').value.trim();
  if(!pid) return alert('请选择题目'); if(!c) return alert('内容不能为空');
  var p = findProblem(pid);
  pending.push({
    id: genId(), problemId: pid,
    problemTitle: p ? (p.luoguId+'：'+p.title) : '未知题目',
    author: cur.name, content: c, time: new Date().toLocaleString()
  });
  localStorage.setItem(PS, JSON.stringify(pending));
  document.getElementById('solContent').value='';
  alert('已提交，等待审核。'); loadProbSelect(); renderPending();
}

// ===== 弹窗：标题读 problemTitle，内容 textContent 原样输出 =====
function openDetail(id, isPending){
  if(!guardAction()) return;
  var list = isPending ? pending : sols;
  var item = null;
  for(var i=0; i<list.length; i++){ if(list[i].id===id){ item=list[i]; break; } }
  if(!item) return;
  currentOpenId=id; currentOpenIsPending=isPending;

  var head = item.problemTitle || '未知题目 + 题解';

  var db = document.getElementById('detailBody');
  db.innerHTML =
    '<div class="detail-title">'+esc(head)+'</div>'+
    '<div class="detail-meta">'+esc(item.author||'')+'　'+esc(item.time||'')+'</div>'+
    '<div class="detail-content"></div>';
  // textContent 原样输出，不渲染不转义
  db.querySelector('.detail-content').textContent = item.content;

  var acts = document.getElementById('detailActions');
  acts.innerHTML = '';
  if(isAdm()){
    if(isPending){
      acts.innerHTML = '<button class="btn btn-primary" onclick="approvePending(\''+id+'\')">✅ 通过</button><button class="btn btn-danger" onclick="rejectPending(\''+id+'\')">↩ 打回</button><button class="btn btn-ghost" onclick="closeDetail()">关闭</button>';
    } else {
      acts.innerHTML = '<button class="btn btn-warn" onclick="unlistSol(\''+id+'\')">⬇ 撤下</button><button class="btn btn-ghost" onclick="closeDetail()">关闭</button>';
    }
  } else {
    acts.innerHTML = '<button class="btn btn-ghost" onclick="closeDetail()">关闭</button>';
  }

  var dm = document.getElementById('detailModal');
  dm.style.display='flex'; dm.classList.add('show');
  document.body.classList.add('modal-open');
}

function closeDetail(){
  document.getElementById('detailModal').style.display='none';
  document.getElementById('detailModal').classList.remove('show');
  document.getElementById('detailBody').innerHTML='';
  document.getElementById('detailActions').innerHTML='';
  currentOpenId=null;
  document.body.classList.remove('modal-open');
}

function approvePending(id){
  var item=null; for(var i=0;i<pending.length;i++){if(pending[i].id===id){item=pending[i];pending.splice(i,1);break;}}
  if(!item) return;
  sols.push(item);
  localStorage.setItem(SS,JSON.stringify(sols)); localStorage.setItem(PS,JSON.stringify(pending));
  loadProbSelect(); renderSols(); renderPending(); closeDetail();
}
function rejectPending(id){ if(!confirm('打回？')) return; for(var i=0;i<pending.length;i++){if(pending[i].id===id){pending.splice(i,1);break;}} localStorage.setItem(PS,JSON.stringify(pending)); renderPending(); closeDetail(); }
function unlistSol(id){ if(!confirm('撤下（回待审）？')) return; var item=null; for(var i=0;i<sols.length;i++){if(sols[i].id===id){item=sols[i];sols.splice(i,1);break;}} if(!item) return; pending.push(item); localStorage.setItem(SS,JSON.stringify(sols)); localStorage.setItem(PS,JSON.stringify(pending)); loadProbSelect(); renderSols(); renderPending(); closeDetail(); }

function cardHTML(item, isPending){
  var head = item.problemTitle || '未知题目 + 题解';
  var preview = String(item.content||'').replace(/\n+/g,' ').replace(/\s+/g,' ').trim();
  if(!preview) preview='（暂无文字预览）';
  if(preview.length>220) preview=preview.slice(0,220)+'…';
  return '<div class="solution-card" onclick="openDetail(\''+item.id+'\','+isPending+')">'+
    '<div class="sol-head">'+esc(head)+'</div>'+
    '<div class="sol-meta">'+esc(item.author||'')+'　'+esc(item.time||'')+'</div>'+
    '<div class="sol-body">'+esc(preview)+'</div>'+
    '<div class="sol-actions"><button onclick="event.stopPropagation();openDetail(\''+item.id+'\','+isPending+')">📖 查看详情</button></div>'+
  '</div>';
}
function renderPending(){
  var c=document.getElementById('pendingList'); if(!c) return;
  if(!isAdm()){ c.innerHTML=''; return; }
  c.innerHTML = pending.length ? pending.map(function(x){return cardHTML(x,true)}).join('') : '<div class="empty-tip">暂无待审题解</div>';
}
function renderSols(){
  var c=document.getElementById('solutionsList'); if(!c) return;
  c.innerHTML = sols.length ? sols.map(function(x){return cardHTML(x,false)}).join('') : '<div class="empty-tip">暂无已通过题解</div>';
}

document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeAuth(); closeDetail(); } });

init();
</script>
</body>
</html>
