<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>洛谷团队 128840</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#2c3e50;line-height:1.65;font-size:14px}
a{text-decoration:none;color:inherit}
.topbar{background:#fff;border-bottom:1px solid #e1e8ed;position:sticky;top:0;z-index:100}
.topbar-inner{max-width:1100px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:#3498db;font-size:16px}
.logo-icon{width:32px;height:32px;border-radius:7px;background:#3498db;color:#fff;display:grid;place-items:center;font-weight:800}
.update-btn{padding:8px 18px;background:#3498db;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px}
.update-btn:hover{background:#2980b9}.update-btn:active{transform:scale(.97)}
.ad-wrap{position:relative;z-index:300;max-width:1100px;margin:20px auto 0;padding:0 20px}
.ad-tag{position:absolute;top:10px;left:34px;background:rgba(255,255,255,.95);color:#3498db;font-size:11px;font-weight:700;padding:3px 11px;border-radius:12px;z-index:10}
.ad-card{display:block;position:relative;height:180px;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(52,152,219,.3);border:2px solid #3498db;transition:.2s;background:#3498db}
.ad-card:hover{transform:translateY(-3px)}
.ad-card-bg{position:absolute;inset:0;z-index:1;background-size:cover;background-position:center}
.ad-card-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#fff;text-align:center}
.ad-card-big{font-size:32px;font-weight:800;letter-spacing:3px;text-shadow:0 3px 16px rgba(0,0,0,.45);margin-bottom:10px}
.ad-card-title{font-size:15px;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.ad-dots{position:absolute;bottom:14px;right:24px;display:flex;gap:6px;z-index:5}
.ad-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;transition:.2s}
.ad-dot.active{background:#fff;width:24px;border-radius:5px}
.container{max-width:1100px;margin:0 auto;padding:20px}
.team-header{background:#fff;border:1px solid #e1e8ed;border-radius:10px;padding:26px 28px;margin-bottom:18px;position:relative}
.team-header::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#3498db,#2ecc71,#f39c12)}
.team-header-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.team-avatar{width:68px;height:68px;border-radius:12px;background:linear-gradient(135deg,#3498db,#2980b9);display:grid;place-items:center;font-size:28px;color:#fff;overflow:hidden}
.team-avatar img{width:100%;height:100%;object-fit:cover}
.team-info h1{font-size:21px;font-weight:700;margin-bottom:5px}
.tag{font-size:11.5px;padding:3px 10px;border-radius:4px;font-weight:600;background:#eaf4fc;color:#3498db}.tag.g{background:#eafaf1;color:#27ae60}

/* 🚀 公告区域（绝对不显示简介） */
#teamNotice{padding:24px 28px;background:#fff;border:1px solid #e1e8ed;border-radius:10px;margin-bottom:18px;font-size:14px;line-height:1.75;box-shadow:0 2px 12px rgba(0,0,0,.02)}
#teamNotice .notice-title{font-weight:700;color:#3498db;margin-bottom:16px;font-size:18px;display:flex;align-items:center;gap:8px;border-bottom:1px dashed #e1e8ed;padding-bottom:12px;}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat-card{background:#fff;border:1px solid #e1e8ed;border-radius:8px;padding:16px 18px;text-align:center;cursor:pointer;transition:.2s}
.stat-card:hover{border-color:#3498db;transform:translateY(-2px)}
.stat-card .num{font-size:25px;font-weight:700;color:#3498db}.stat-card .label{font-size:12.5px;color:#7f8c8d}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid #e1e8ed;border-radius:8px;padding:6px;margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 22px;border:none;background:transparent;color:#7f8c8d;font-size:13.5px;font-weight:600;border-radius:6px;cursor:pointer;white-space:nowrap}
.tab.active{background:#3498db;color:#fff}
.two-col{display:grid;grid-template-columns:1fr 300px;gap:18px}
.card{background:#fff;border:1px solid #e1e8ed;border-radius:8px;margin-bottom:18px;overflow:hidden}
.card-head{padding:13px 20px;border-bottom:1px solid #e1e8ed;display:flex;align-items:center;justify-content:space-between;background:#fafbfc}
.card-head h3{font-size:14.5px;font-weight:700}.card-head h3::before{content:"";display:inline-block;width:3px;height:16px;background:#3498db;margin-right:8px;vertical-align:-2px}
.card-body{padding:14px 18px}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-bottom:1px solid #f0f3f6;cursor:pointer;transition:.15s}
.item-row:hover{background:#eaf4fc}
.item-id{font-size:12px;font-weight:700;color:#3498db;background:#eaf4fc;padding:2px 8px;border-radius:4px;margin-right:10px}
.item-title{font-size:13.5px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-extra{font-size:12px;color:#7f8c8d;margin-left:10px}
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.member-item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid #e1e8ed;border-radius:8px;transition:.18s}
.member-item:hover{border-color:#3498db;transform:translateY(-2px)}
.member-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;overflow:hidden;background:#3498db}
.member-avatar img{width:100%;height:100%;object-fit:cover}
.member-name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:9px;white-space:nowrap}
.badge.owner{background:#fff7e6;color:#d48806;border:1px solid #ffd591}
.badge.admin{background:#f0f5ff;color:#2f54eb;border:1px solid #adc6ff}
.badge.member{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.badge.group{background:#f4ecf7;color:#8e44ad;border:1px solid #d3b8e3}
.c-gray{color:#bfbfbf}.c-blue{color:#3498db}.c-green{color:#52c41a}.c-orange{color:#f39c11}.c-red{color:#fe4c61}.c-purple{color:#9d3dcf}.c-black{color:#0e1d69}.c-yellow{color:#ffc116}.c-brown{color:#996600}
.filter-bar{display:flex;gap:7px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #f0f3f6;margin-bottom:12px}
.filter-chip{padding:5px 13px;border:1px solid #e1e8ed;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer}
.filter-chip.active{background:#3498db;color:#fff;border-color:#3498db}
.side-stat{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f3f6;font-size:13px}
.rules{background:#fff;border:1px solid #e1e8ed;border-radius:8px;padding:22px 26px;margin-top:20px}
.rules h3{font-size:15px;font-weight:700;margin-bottom:14px}
.rules ol{margin-left:22px;color:#5b6b7a;font-size:13.5px;line-height:1.9}
footer{text-align:center;padding:26px 20px;color:#7f8c8d;font-size:12.5px;border-top:1px solid #e1e8ed;margin-top:24px}

/* 🚀 完美还原洛谷公告带蓝线折叠的样式 */
.markdown-body{font-size:14px;line-height:1.75;color:#2c3e50}
.markdown-body blockquote {
    margin: 10px 0; padding: 10px 16px; border-left: 4px solid #3498db; background: #f8fbff; border-radius: 0 4px 4px 0; color: #5b6b7a;
}
.markdown-body details {
    margin: 10px 0; padding: 10px 16px; border-left: 4px solid #3498db; background: #f8fbff; border-radius: 0 4px 4px 0;
}
.markdown-body summary {
    cursor: pointer; font-weight: 600; color: #3498db; list-style: none; display: flex; align-items: center; gap: 8px;
}
.markdown-body summary::-webkit-details-marker { display: none; }
.markdown-body summary::before {
    content: "▶"; font-size: 12px; color: #3498db; transition: transform 0.2s;
}
.markdown-body details[open] summary::before { transform: rotate(90deg); }
.markdown-body ul, .markdown-body ol { margin: 8px 0; padding-left: 24px; }
.katex{font-size:1.05em}
</style>
</head>
<body>
<nav class="topbar"><div class="topbar-inner">
<div class="logo"><span class="logo-icon">L</span><span>洛谷团队</span></div>
<div class="user-area">
<a href="https://github.com/CDxiaolang/CDxiaolang.github.io/actions" target="_blank" class="update-btn">🚀 前往 GitHub 更新</a>
</div></div></nav>

<div class="ad-wrap" id="adWrap" style="display:none">
<div class="ad-tag">📢 推荐</div>
<div id="adSlider"></div>
</div>

<div class="container">
<!-- 🚀 公告区 -->
<div id="teamNotice"></div>

<div class="team-header">
<div class="team-header-top">
<div class="team-avatar" id="teamAvatar">🚀</div>
<div class="team-info"><h1 id="teamName">加载中...</h1><div class="team-meta" id="teamMeta"></div></div>
</div>
</div>
<div class="stats-row" id="statsRow"></div>
<div class="tabs" id="tabs"></div>
<div id="content"></div>
<div class="rules"><h3>📋 使用规则</h3><ol id="rulesList"></ol></div>
</div>
<footer>© 2025 洛谷团队 128840 · 数据更新于 <b id="updatedAt">—</b></footer>

<script>
let DATA = {}, CONFIG = {};
const TID = 128840, BASE = 'https://www.luogu.com.cn';
const TAB_NAMES = {overview:"概览",problem:"题目",homework:"作业",training:"题单",contest:"比赛",member:"成员",discuss:"讨论",file:"文件"};
const DIFF_NAMES=["暂无评定","入门","普及−","普及/提高−","普及+/提高","提高+/省选−","省选/NOI−","NOI/NOI+/CTSC"];
const DIFF_COLORS=["#bfbfbf","#fe4c61","#f39c11","#ffc116","#52c41a","#3498db","#9d3dcf","#0e1d69"];
let currentFilter="all", adTimer=null, adIndex=0;

function esc(s){s=String(s==null?"":s);return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function num(v){const n=Number(v);return isFinite(n)?n:0}
function deepGet(o,p){return p.split('.').reduce((a,k)=>(a==null?undefined:a[k]),o)}
function pick(o,paths){for(const p of paths){const v=deepGet(o,p);if(v!==undefined&&v!==null&&v!=='')return v}return undefined}
function pickAny(o,keys){if(!o)return undefined;for(const k of keys){const v=o[k];if(v!==undefined&&v!==null&&v!=='')return v}return undefined}
function findList(key){const cd=DATA[key];if(!cd)return[];const d=cd.data||cd;for(const k in d){const v=d[k];if(v&&Array.isArray(v.result))return v.result;if(Array.isArray(v)&&v.length&&typeof v[0]==='object')return v}return[]}

function getTeamInfo(){const t=DATA.team;if(!t)return null;const d=t.data||t;let tob=d.team||d;if(!tob||(!tob.name&&!tob.title)){try{const m=DATA.member,dm=m&&m.data?m.data:m;if(dm&&dm.team)tob=dm.team}catch(e){}}return tob}
function getMasterUid(){
  let uid = 0;
  try {
    const t = DATA.team, d = t && t.data ? t.data : t;
    if (d) {
      const tob = d.team || d;
      uid = num(pick(tob, ['master.uid', 'masterUid', 'master_uid', 'owner.uid'])) || 0;
    }
  } catch(e) {}
  return uid;
}
function getGroups(){
  const cd=DATA.member;if(!cd)return[];const d=cd.data||cd;
  let gs = [];
  if (d.groups) {
      if (Array.isArray(d.groups)) gs = d.groups;
      else if (d.groups.result && Array.isArray(d.groups.result)) gs = d.groups.result;
  } else if (d.groupList && Array.isArray(d.groupList)) {
      gs = d.groupList;
  }
  return gs.map(g => {
    let uids = [];
    const rawMembers = g.members || g.uids || g.userIds || g.user_ids || g.memberList || [];
    if (Array.isArray(rawMembers)) {
      uids = rawMembers.map(m => {
        if (typeof m === 'number') return m;
        if (typeof m === 'string') return num(m);
        return num(m.uid || m.user?.uid || m.id);
      }).filter(Boolean);
    }
    return { name: g.name || g.title || "未命名分组", uids: uids };
  });
}
function getAdminGroupUids(){const s={};getGroups().forEach(g=>{const n=g.name||'';if(!/管理|admin|出题/i.test(n))return;g.uids.forEach(u=>s[u]=true)});return s}
function getOwnerGroupUids(){const s={};getGroups().forEach(g=>{const n=g.name||'';if(!/所有者|团长|owner|管理/i.test(n))return;g.uids.forEach(u=>s[u]=true)});return s}

function detectRole(m,mu,au,ou){
  const uid=num(pick(m,['uid','id','user.uid']))||0;
  if(mu>0&&uid>0&&uid===mu)return"owner";
  if(uid>0&&ou[uid])return"owner";
  const isAdmin = m.isAdmin === true || m.user?.isAdmin === true || m.type === 2 || m.user?.type === 2;
  if(isAdmin) return "admin";
  if(uid>0&&au[uid])return"admin";
  return"member";
}

function getNameColorClass(m){
  const rawColor = m.color || m.user?.color || m.nameColor || m.user?.nameColor || '';
  const r = parseInt(m.rating || m.user?.rating || 0);
  const c = String(rawColor).toLowerCase();
  if (c.includes('gray') || c.includes('grey') || c.includes('灰')) return 'c-gray';
  if (c.includes('blue') || c.includes('蓝')) return 'c-blue';
  if (c.includes('green') || c.includes('绿')) return 'c-green';
  if (c.includes('orange') || c.includes('橙')) return 'c-orange';
  if (c.includes('red') || c.includes('红')) return 'c-red';
  if (c.includes('purple') || c.includes('紫')) return 'c-purple';
  if (c.includes('black') || c.includes('黑')) return 'c-black';
  if (c.includes('yellow') || c.includes('黄')) return 'c-yellow';
  if (c.includes('brown') || c.includes('棕')) return 'c-brown';
  if (r >= 2400) return 'c-red';
  if (r >= 2000) return 'c-orange';
  if (r >= 1600) return 'c-green';
  if (r >= 1200) return 'c-blue';
  return 'c-gray';
}

function getMembers(){
  const mu=getMasterUid(), au=getAdminGroupUids(), ou=getOwnerGroupUids(); 
  const groups = getGroups();
  return findList("member").map(m=>{
    const uid=num(pick(m,['uid','id','user.uid']))||0;
    const name=pick(m,['name','user.name','username','user.username','nickname','user.nickname'])||"未知";
    const role=detectRole(m,mu,au,ou);
    const avatar=pick(m,['avatar','user.avatar'])||(uid>0?`https://cdn.luogu.com.cn/upload/usericon/${uid}.png`:'');
    let myGroups = [];
    groups.forEach(g => { if(g.uids.includes(uid)) myGroups.push(g.name); });
    const mGroups = m.groups || m.user?.groups || m.group || m.user?.group;
    if (mGroups) {
      if (Array.isArray(mGroups)) {
        mGroups.forEach(g => {
          const gname = typeof g === 'string' ? g : (g.name || '');
          if (gname && !myGroups.includes(gname)) myGroups.push(gname);
        });
      } else if (typeof mGroups === 'string') {
        if (!myGroups.includes(mGroups)) myGroups.push(mGroups);
      } else if (mGroups.name) {
        if (!myGroups.includes(mGroups.name)) myGroups.push(mGroups.name);
      }
    }
    return {uid,name,role,avatar,groups:myGroups, colorClass:getNameColorClass(m)};
  });
}

function getProblems(){return findList("problem").map(p=>({id:p.pid||p.id||"",title:p.name||p.title||"",difficulty:p.difficulty}))}
function getContests(){return findList("contest").map(c=>({id:c.id||"",title:c.title||c.name||""}))}
function getTrainings(){return findList("training").map(t=>({id:t.id||"",title:t.title||t.name||"",problemCount:t.problemCount||0}))}
function getHomework(){return findList("homework").map(h=>({id:h.id||"",title:h.title||h.name||"",problemCount:h.problemCount||0}))}
function getFiles(){return findList("file").map(f=>({id:f.id||"",name:f.name||f.filename||"",size:f.size||0}))}

function getDiscussions() {
  let raw = findList("discuss");
  if (!raw || !raw.length) {
    function deepSearch(obj) {
      if (!obj) return null;
      if (Array.isArray(obj)) {
        if (obj.length > 0 && typeof obj[0] === 'object' && (obj[0].title || obj[0].name)) {
          if (obj[0].replyCount !== undefined || obj[0].replies !== undefined || obj[0].author || obj[0].user) return obj;
        }
        for (let item of obj) { const res = deepSearch(item); if (res) return res; }
      } else if (typeof obj === 'object') {
        for (let key in obj) {
          if (key === 'discussions' || key === 'feeds' || key === 'threads' || key === 'posts') { const res = deepSearch(obj[key]); if (res) return res; }
          const res = deepSearch(obj[key]); if (res) return res;
        }
      }
      return null;
    }
    raw = deepSearch(DATA) || [];
  }
  return raw.map(d => {
    const authorObj = d.author || d.user || d.poster || {};
    return {
      id: d.id || d.did || d.tid || "", title: d.title || d.name || "无标题",
      authorName: authorObj.name || d.authorName || d.posterName || "未知",
      authorUid: num(authorObj.uid || authorObj.id || d.authorUid || 0),
      authorColor: authorObj.color || d.color || "", replyCount: d.replyCount || d.replies || d.commentCount || 0,
      time: d.time || d.createTime || d.postTime || ""
    };
  });
}

function roleBadge(role){const t={owner:"👑 所有者",admin:"🛡 管理员",member:"· 成员"};const c={owner:"owner",admin:"admin",member:"member"};return`<span class="badge ${c[role]}">${t[role]}</span>`}
function groupBadge(n){return n?`<span class="badge group">${esc(n)}</span>`:""}
function diffTag(d){const i=typeof d==="number"?d:-1;return`<span style="font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:4px;background:${DIFF_COLORS[i]||"#ccc"}22;color:${DIFF_COLORS[i]||"#ccc"}">${esc(DIFF_NAMES[i]||"—")}</span>`}
function avatarColor(i){return["#3498db","#2ecc71","#f39c12","#9b59b6","#e74c3c","#1abc9c","#34495e","#e91e63"][i%8]}

function problemRow(p){return`<a class="item-row" href="${BASE}/problem/${esc(p.id)}" target="_blank"><span class="item-id">${esc(p.id)}</span><span class="item-title">${esc(p.title)}</span>${diffTag(p.difficulty)}</a>`}
function contestRow(c){return`<a class="item-row" href="${BASE}/contest/${esc(c.id)}" target="_blank"><span class="item-id">#${esc(c.id)}</span><span class="item-title">${esc(c.title)}</span></a>`}
function trainingRow(t){return`<a class="item-row" href="${BASE}/training/${esc(t.id)}" target="_blank"><span class="item-id">${esc(t.id)}</span><span class="item-title">${esc(t.title)}</span><span class="item-extra">${t.problemCount} 题</span></a>`}
function homeworkRow(h){return`<div class="item-row"><span class="item-id">HW</span><span class="item-title">${esc(h.title)}</span><span class="item-extra">${h.problemCount} 题</span></div>`}
function discussRow(d) {
  const url = d.id ? `${BASE}/discuss/${d.id}` : '#';
  let colorCls = getNameColorClass({ color: d.authorColor });
  return `<a class="item-row" href="${url}" target="_blank"><span class="item-title" style="font-weight:600;font-size:14px;">${esc(d.title)}</span><span class="item-extra" style="width:150px;text-align:right;white-space:nowrap;"><span class="${colorCls}">${esc(d.authorName)}</span> · ${d.replyCount} 回复</span></a>`;
}
function fileRow(f){const url = f.id ? `${BASE}/team/${TID}/file/${f.id}/download` : '#';return `<a class="item-row" href="${url}" target="_blank"><span class="item-id">📄</span><span class="item-title">${esc(f.name)}</span><span class="item-extra">${f.size?Math.round(f.size/1024)+' KB':''} ⬇️</span></a>`;}
function memberCard(m,i){const gt = (m.groups&&m.groups.length)?m.groups.map(groupBadge).join(""):'';const av = m.avatar?`<div class="member-avatar" style="background:${avatarColor(i)}"><img src="${esc(m.avatar)}" onerror="this.style.display='none';this.parentNode.textContent='${esc(m.name[0]||'?')}'"></div>`:`<div class="member-avatar" style="background:${avatarColor(i)}">${esc(m.name[0]||'?')}</div>`;const link = m.uid>0?`${BASE}/user/${m.uid}`:'#';return `<a class="member-item" href="${link}" target="_blank">${av}<div style="min-width:0;flex:1"><div class="member-name"><span class="${m.colorClass}">${esc(m.name)}</span> ${roleBadge(m.role)}</div>${gt?`<div class="member-meta" style="font-size:11px;color:#7f8c8d;margin-top:3px">${gt}</div>`:''}</div></a>`;}

function rOverview(){
  const probs=getProblems().slice(0,5),cons=getContests().slice(0,4),mems=getMembers().slice(0,8);
  const pr=probs.length?probs.map(problemRow).join(""):'<div style="text-align:center;padding:20px;color:#7f8c8d">暂无数据</div>';
  const cr=cons.length?cons.map(contestRow).join(""):'<div style="text-align:center;padding:20px;color:#7f8c8d">暂无数据</div>';
  const mr=mems.length?mems.map(memberCard).join(""):'<div style="text-align:center;padding:20px;color:#7f8c8d">暂无数据</div>';
  return `<div class="two-col"><div>
    <div class="card"><div class="card-head"><h3>近期比赛</h3><span style="color:#3498db;cursor:pointer" onclick="switchView('contest')">查看全部 →</span></div><div class="card-body">${cr}</div></div>
    <div class="card"><div class="card-head"><h3>团队题目</h3><span style="color:#3498db;cursor:pointer" onclick="switchView('problem')">查看全部 →</span></div><div class="card-body">${pr}</div></div>
    <div class="card"><div class="card-head"><h3>团队成员</h3><span style="color:#3498db;cursor:pointer" onclick="switchView('member')">查看全部 →</span></div><div class="card-body"><div class="member-grid">${mr}</div></div></div>
  </div><div>
    <div class="card"><div class="card-head"><h3>数据概览</h3></div><div class="card-body">
      <div class="side-stat"><span>团队成员</span><b style="color:#3498db">${getMembers().length}</b></div>
      <div class="side-stat"><span>团队题目</span><b style="color:#3498db">${getProblems().length}</b></div>
      <div class="side-stat"><span>团队比赛</span><b style="color:#3498db">${getContests().length}</b></div>
      <div class="side-stat"><span>训练题单</span><b style="color:#3498db">${getTrainings().length}</b></div>
      <div class="side-stat"><span>团队分组</span><b style="color:#3498db">${getGroups().length}</b></div>
      <div class="side-stat"><span>团队讨论</span><b style="color:#3498db">${getDiscussions().length}</b></div>
      <div class="side-stat"><span>团队文件</span><b style="color:#3498db">${getFiles().length}</b></div>
    </div></div>
  </div></div>`;
}
function rProblems(){const p=getProblems();return`<div class="card"><div class="card-head"><h3>团队题目（${p.length}）</h3></div><div class="card-body">${p.length?p.map(problemRow).join(""):'暂无'}</div></div>`}
function rHomework(){const h=getHomework();return`<div class="card"><div class="card-head"><h3>团队作业（${h.length}）</h3></div><div class="card-body">${h.length?h.map(homeworkRow).join(""):'暂无'}</div></div>`}
function rTraining(){const t=getTrainings();return`<div class="card"><div class="card-head"><h3>训练题单（${t.length}）</h3></div><div class="card-body">${t.length?t.map(trainingRow).join(""):'暂无'}</div></div>`}
function rContest(){const c=getContests();return`<div class="card"><div class="card-head"><h3>团队比赛（${c.length}）</h3></div><div class="card-body">${c.length?c.map(contestRow).join(""):'暂无'}</div></div>`}
function rDiscuss(){const d = getDiscussions();if(!d.length) return `<div class="card"><div class="card-body" style="text-align:center;padding:20px">暂无讨论数据</div></div>`;return `<div class="card"><div class="card-head"><h3>团队讨论（${d.length}）</h3></div><div class="card-body">${d.map(discussRow).join("")}</div></div>`;}
function rMember(){
  const all=getMembers();
  if(!all.length)return`<div class="card"><div class="card-body" style="text-align:center;padding:20px">暂无成员</div></div>`;
  const gc={};all.forEach(m=>m.groups.forEach(g=>gc[g]=(gc[g]||0)+1));
  let fb = `<div class="filter-bar"><button class="filter-chip ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">全部 <span>${all.length}</span></button>`;
  Object.keys(gc).sort().forEach(g=>{fb += `<button class="filter-chip ${currentFilter===g?'active':''}" onclick="setFilter('${esc(g).replace(/'/g,'')}')">${esc(g)} <span>${gc[g]}</span></button>`;});
  fb += '</div>';
  const filtered = currentFilter==='all' ? all : all.filter(m=>m.groups.includes(currentFilter));
  return `<div class="card"><div class="card-head"><h3>团队成员（${all.length}）</h3></div><div class="card-body">${fb}<div class="member-grid">${filtered.map(memberCard).join("")}</div></div></div>`;
}
function rFile(){const f=getFiles();return`<div class="card"><div class="card-head"><h3>团队文件（${f.length}）</h3></div><div class="card-body">${f.length?f.map(fileRow).join(""):'暂无'}</div></div>`}

const RENDERERS={overview:rOverview,problem:rProblems,homework:rHomework,training:rTraining,contest:rContest,member:rMember,discuss:rDiscuss,file:rFile};
function switchView(name){if(!RENDERERS[name])return;document.getElementById("content").innerHTML=RENDERERS[name]();document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.view===name))}
window.switchView=switchView;
window.setFilter=function(f){currentFilter=f;switchView("member")};

function renderAds(){
  const ads=CONFIG.ads||[];
  if(!ads.length){document.getElementById("adWrap").style.display='none';return}
  document.getElementById("adWrap").style.display='block';
  const box=document.getElementById("adSlider");
  function render(){
    const a=ads[adIndex];let bg=a.bg||'linear-gradient(135deg,#3498db,#2980b9)';
    if(!/url\(|linear-gradient|radial-gradient|^#/.test(bg))bg='linear-gradient(135deg,'+bg+')';
    box.innerHTML=`<a class="ad-card" href="${esc(a.link||'#')}" target="_blank"><div class="ad-card-bg" style="background:${esc(bg)}"></div><div class="ad-card-content">${a.big?`<div class="ad-card-big">${esc(a.big)}</div>`:''}${a.title?`<div class="ad-card-title">${esc(a.title)}</div>`:''}</div><div class="ad-dots">${ads.map((_,i)=>`<div class="ad-dot ${i===adIndex?'active':''}" onclick="event.preventDefault();window._setAd(${i})"></div>`).join('')}</div></a>`;
  }
  window._setAd = (i) => { adIndex = i; render(); };
  adIndex=0;render();
  clearInterval(adTimer);if(ads.length>1)adTimer=setInterval(()=>{adIndex=(adIndex+1)%ads.length;render()},5000);
}

async function boot(){
  try{
    const res = await fetch('./data.json?_=' + Date.now());
    DATA = await res.json();
  }catch(e){ console.warn('data.json 加载失败', e); }
  try{
    const res = await fetch('./config.js?_=' + Date.now());
    const text = await res.text();
    (new Function(text))();
    CONFIG = window.__TEAM_CONFIG__ || {};
  }catch(e){ console.warn('config.js 加载失败'); }

  const tName = getTeamInfo()?.name || ("团队 " + TID);
  document.getElementById("teamName").textContent = tName;
  const tAvatar = getTeamInfo()?.avatar || "";
  if(tAvatar) document.getElementById("teamAvatar").innerHTML = `<img src="${esc(tAvatar)}" onerror="this.parentNode.textContent='🚀'">`;
  document.getElementById("teamMeta").innerHTML = `<span class="tag">洛谷团队</span><span class="tag g">编号 ${TID}</span>`;
  
  // 🚀 只渲染公告！绝对不渲染简介！
  const noticeEl = document.getElementById("teamNotice");
  if(DATA.noticeHtml && DATA.noticeHtml.trim() !== ""){
    noticeEl.innerHTML = `<div class="notice-title">📢 团队公告</div><div id="noticeContent" class="markdown-body">${DATA.noticeHtml}</div>`;
  } else {
    noticeEl.innerHTML = `<div class="notice-title">📢 团队公告</div><div style="color:#999;padding:10px 0;">暂无公告</div>`;
  }

  document.getElementById("rulesList").innerHTML = (CONFIG.rules||[]).map(r=>`<li>${esc(r)}</li>`).join('');
  
  const mc=getMembers().length, pc=getProblems().length, cc=getContests().length, gc=getGroups().length;
  document.getElementById("statsRow").innerHTML = `
    <div class="stat-card" onclick="switchView('member')"><div class="num">${mc}</div><div class="label">团队成员</div></div>
    <div class="stat-card" onclick="switchView('problem')"><div class="num">${pc}</div><div class="label">团队题目</div></div>
    <div class="stat-card" onclick="switchView('contest')"><div class="num">${cc}</div><div class="label">团队比赛</div></div>
    <div class="stat-card" onclick="switchView('member')"><div class="num">${gc}</div><div class="label">团队分组</div></div>`;
  
  document.getElementById("tabs").innerHTML = Object.keys(TAB_NAMES).map(k=>`<button class="tab ${k==='overview'?'active':''}" data-view="${k}" onclick="switchView('${k}')">${TAB_NAMES[k]}</button>`).join('');
  
  document.getElementById("updatedAt").textContent = DATA.updatedAt || "未知";
  
  renderAds();
  switchView('overview');
}
boot();
</script>
</body>
</html>
